name: Oráculo - Ciclo Automático

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  oracle-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sincronizar, avaliar, aprender e congelar os próximos palpites
        env:
          ORACULO_API_URL: https://oraculo-backend-mor3.onrender.com
        run: |
          set -e
          curl --fail --retry 3 --retry-delay 5 --max-time 180 \
            "${ORACULO_API_URL}/api/oracle/cycle"
